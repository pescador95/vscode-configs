name: Local Config
version: 1.0.0
schema: v1

models:
  - name: Bonsai Agent
    provider: lmstudio
    apiBase: http://localhost:1234/v1
    model: prism-ml/bonsai-27b
    roles:
      - chat
    contextLength: 32768
    maxTokens: 4096

  - name: Bonsai Edit & Apply
    provider: lmstudio
    apiBase: http://localhost:1234/v1
    model: prism-ml/bonsai-27b
    roles:
      - edit
      - apply
    contextLength: 32768
    maxTokens: 12288
      
  - name: Qwen AutoComplete
    provider: lmstudio
    apiBase: http://localhost:1234/v1
    model: qwen2.5-coder-1.5b-instruct
    roles:
      - autocomplete
    contextLength: 8192
    maxTokens: 512   

  - name: Embeddings
    provider: lmstudio
    apiBase: http://localhost:1234/v1
    model: nomic-embed-code
    roles:
      - embed

context:
  - provider: codebase
  - provider: file
  - provider: folder
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: repo-map
  - provider: docs
  - provider: http
  - provider: search
